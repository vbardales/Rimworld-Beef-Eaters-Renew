<!doctype html><meta charset="utf-8">
<!--
  Engraving page for Mod/About/Preview.png, per STYLE_RIMWORLD.md.

  Rasterised with headless Chrome at 896x504, so the glyphs are composed at final size and never
  resampled. The background is Preview-source.png at full resolution, scaled and cropped here
  rather than beforehand: starting from an already-reduced Preview.png would resample the picture
  twice.

    chrome --headless --disable-gpu --screenshot=Mod/About/Preview.png \
           --window-size=896,504 --hide-scrollbars Art/preview.html

  The source is 1380x1140, close to 6:5, so a third of its height has to go to reach 16:9. The
  crop is taken low: the top strip is empty plank floor and a settler walking out of frame, while
  the band below holds the lantern, the lit animal under it and the straw at the fence.

  The veil is the wood of the floor rather than the near-black the first 54 showcases used - the
  rule of 2026-09-12 is that the veil takes a colour from the picture, and here the picture is a
  barn floor at night, so the colour it has to give is a warm plank brown. Sampled over the block
  the text occupies, mean rgb(109,80,50), then taken down a notch to #4A3A2C so it reads as one
  flat field rather than as a stain over the planks. Its relative luminance is 0.047, well under
  the 0.18 line, so the ink is the pale one and the text shadows stay: they lift the glyphs off
  the planks that show through at the end of the wash. The rule keeps the repository amber, which
  a dark brown carries without trouble.

  No count is engraved. Two animals would be a true number and a pointless one - the summary
  names them both.
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:896px; height:504px; overflow:hidden; background:#000; }
  .stage { position:relative; width:896px; height:504px;
           font-family:"Segoe UI",system-ui,sans-serif; }

  .shot { position:absolute; inset:0; width:896px; height:504px;
          object-fit:cover; object-position:50% 62%; }

  /* Repository standard: a wash from the top-left corner, in the dark form, because the veil
     colour is dark. It lands on the bare plank floor left of the lamp pool, which is the calmest
     corner of the picture and the one the prompt reserved.

     Two departures from the standard 74% circle, both measured rather than chosen. The lamp pool
     reaches further left than any of the first 54 pictures did, and the standard wash was dead by
     the time it met it: the tail of the summary sat at 2.0:1. The wash is stretched to 88% and the
     text column narrowed from 430 to 392px, which breaks the summary before it reaches the light.
     Worst point over a glyph is now 6.5:1, against the 4.5:1 the guide asks for. */
  .veil { position:absolute; inset:0;
    background: radial-gradient(ellipse 760px 560px at top left, rgba(74,58,44,.94) 0%, rgba(74,58,44,.88) 45%, rgba(74,58,44,0) 100%); }

  .text { position:absolute; left:56px; top:86px; width:392px; }
  h1 { font-size:52px; line-height:1.06; font-weight:700; color:#F2ECE1; letter-spacing:-.5px;
       text-shadow:0 2px 10px rgba(0,0,0,.55); }
  .rule { width:58px; height:3px; background:#D68F2C; margin:22px 0 20px; }
  /* The summary is 290px wide rather than the repository's 430. Measured on the rendered PNG,
     with the veil in place: the title rows are safe out to x=500, the summary rows only to 346,
     because they sit lower and the lamp pool climbs into that column. 56 + 290 = 346. The
     paragraph runs to three lines instead of two; the alternative was a tail at 2.9:1. */
  p { font-size:21px; line-height:1.42; color:#D8CFC0; text-shadow:0 1px 6px rgba(0,0,0,.5);
      width:290px; }
</style>
<div class="stage">
  <img class="shot" src="Preview-source.png">
  <div class="veil"></div>
  <div class="text">
    <h1>Beef Eaters<br>Renew</h1>
    <div class="rule"></div>
    <p>A cow bred to be all meat, and a muffalo a quarter its usual size.</p>
  </div>
</div>
