<!doctype html>
<meta charset="utf-8">
<title>Beef Eaters Renew preview</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body,.stage { width:896px; height:504px; overflow:hidden; }
.stage { position:relative; font-family:"Segoe UI",system-ui,sans-serif; }
.shot { position:absolute; inset:0; width:896px; height:504px; object-fit:cover; object-position:50% 62%; }
.veil { position:absolute; inset:0; background:radial-gradient(ellipse 920px 700px at top left, rgb(var(--veilRGB) / .96) 0%, rgb(var(--veilRGB) / .92) 48%, rgb(var(--veilRGB) / 0) 100%); }
.text { position:absolute; left:50px; top:54px; width:430px; text-shadow:0 3px 10px rgba(0,0,0,.75); }
h1 { font-size:46px; font-weight:600; line-height:1.1; letter-spacing:0; color:var(--inkPrimary); }
h1 .title-suffix { font-size:.65em; color:var(--inkSecondary); }
.tag { margin-top:8px; font-size:24px; font-weight:400; line-height:1.1; letter-spacing:.2px; color:var(--inkSecondary); }
.rule { width:58px; height:3px; margin:20px 0 16px; background:var(--accent); }
p { width:430px; font-size:21px; font-weight:400; line-height:1.45; letter-spacing:0; color:var(--inkPrimary); }
.badge { position:absolute; top:0; right:0; width:80px; height:80px; background:var(--accent); clip-path:polygon(0 0,100% 0,100% 100%); }
.version { position:absolute; left:869px; top:27px; transform:translate(-50%,-50%) rotate(45deg); color:var(--badgeInk); font-size:26px; font-weight:700; line-height:1; }
</style>
<div class="stage">
<img class="shot" src="Preview.png">
<div class="veil"></div>
<div class="text"><h1>Beef Eaters<br><span class="title-suffix">Renew</span></h1><div class="tag">(unofficial)</div><div class="rule"></div><p>A cow bred to be all meat, and a much smaller muffalo crossbreed.</p></div>
<div class="badge"></div><div class="version"></div>
</div>
<script>
window.previewReady = (async () => {
 const palette = await (await fetch('preview-palette.json')).json();
 for (const [key,value] of Object.entries(palette)) document.documentElement.style.setProperty('--'+key,value);
 document.documentElement.style.setProperty('--veilRGB',palette.veil.slice(1).match(/../g).map(v=>parseInt(v,16)).join(' '));
 const xml = new DOMParser().parseFromString(await (await fetch('../Mod/About/About.xml')).text(),'text/xml');
 const versions = [...xml.querySelectorAll('supportedVersions > li')].map(n=>n.textContent.trim()).filter(v=>/^\d+(\.\d+)+$/.test(v));
 versions.sort((a,b)=>{const aa=a.split('.').map(Number),bb=b.split('.').map(Number);for(let i=0;i<Math.max(aa.length,bb.length);i++){const d=(aa[i]||0)-(bb[i]||0);if(d)return d;}return 0;});
 document.querySelector('.version').textContent=versions.at(-1);
 await document.fonts.ready;
 await document.querySelector('.shot').decode();
})();
</script>
